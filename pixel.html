<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gato Pixel - Nuevo</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17162a;
  --panel:#201e38;
  --text:#efe7d2;
  --muted:#9c96bd;
  --teal:#5fb8a8;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); }
body {
  font-family: "IBM Plex Sans", system-ui, sans-serif;
  color: var(--text);
  display: flex;
  flex-direction: column;
}

/* ── ESCENARIO CON EL PAISAJE ── */
.stage {
  position: relative;
  width: 100%;
  flex-grow: 1;
  /* Aquí usamos tu imagen de fondo */
  background: url('fondo.png') center bottom / cover no-repeat;
  image-rendering: pixelated;
  cursor: crosshair;
  overflow: hidden;
}

/* Capa para oscurecer un poco el pasto y que el gato resalte */
.stage::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(180deg, transparent 60%, rgba(30, 50, 20, 0.4) 100%);
  z-index: 1;
}

.stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
}

.hint {
  position: absolute;
  left: 20px;
  bottom: 20px;
  z-index: 3;
  font-family: "Silkscreen", monospace;
  font-size: 14px;
  color: rgba(255,255,255,0.7);
  text-shadow: 1px 1px 0 #000;
  pointer-events: none;
  transition: opacity 0.4s;
}
.hint.gone { opacity: 0; }

/* ── CONTROLES INFERIORES ── */
.controls {
  background: var(--panel);
  padding: 12px 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  align-items: center;
  justify-content: center;
  border-top: 2px solid rgba(255,255,255,0.1);
  z-index: 10;
}

.dial {
  display: flex;
  align-items: center;
  gap: 10px;
}
.dial label {
  font-family: "Silkscreen", monospace;
  font-size: 12px;
  color: var(--muted);
}
input[type=range] { accent-color: var(--teal); width: 100px; }
.dial output { font-variant-numeric: tabular-nums; min-width: 2ch; font-size: 14px; }

.switch {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-family: "Silkscreen", monospace;
  font-size: 12px;
  color: var(--muted);
}
input[type=checkbox] { accent-color: var(--teal); width: 16px; height: 16px; cursor: pointer; }

/* ── SELECTOR DE POSES ── */
.poses-bar {
  position: absolute;
  top: 15px;
  left: 15px;
  display: flex;
  gap: 8px;
  z-index: 5;
  background: rgba(0,0,0,0.5);
  padding: 8px;
  border-radius: 8px;
  backdrop-filter: blur(4px);
  overflow-x: auto;
  max-width: calc(100% - 30px);
}

.pose-btn {
  background: transparent;
  border: 2px solid transparent;
  border-radius: 4px;
  cursor: pointer;
  padding: 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: all 0.2s;
}
.pose-btn:hover { background: rgba(255,255,255,0.1); }
.pose-btn[aria-pressed="true"] { border-color: var(--teal); background: rgba(95,184,168,0.2); }
.pose-btn span {
  font-family: "Silkscreen", monospace;
  font-size: 9px;
  color: #fff;
}
.sprite-preview {
  width: 32px;
  height: 32px;
  background-image: url('gato.png');
  background-size: 128px 256px;
  image-rendering: pixelated;
}

@media (max-width: 820px) and (orientation: landscape) {
  .controls { padding: 6px 10px; gap: 10px; }
  .poses-bar { top: 10px; left: 10px; padding: 4px; gap: 4px; }
  .sprite-preview { width: 24px; height: 24px; }
  .pose-btn span { display: none; }
  .hint { display: none; }
}
</style>
</head>
<body>

  <!-- Barra flotante para elegir pose -->
  <div class="poses-bar" id="posesBar"></div>

  <!-- Escenario con el paisaje -->
  <div class="stage" id="stage">
    <canvas id="lienzo"></canvas>
    <span class="hint" id="hint">Toca para llamarlo</span>
  </div>

  <!-- Controles -->
  <div class="controls">
    <div class="dial">
      <label for="fps">VELOCIDAD</label>
      <input type="range" id="fps" min="2" max="16" step="1" value="8">
      <output id="fpsOut">8</output>
    </div>
    <div class="dial">
      <label for="escala">TAMAÑO</label>
      <input type="range" id="escala" min="2" max="10" step="1" value="6">
      <output id="escalaOut">6×</output>
    </div>
    <label class="switch">
      <input type="checkbox" id="vida" checked>
      VIDA PROPIA
    </label>
  </div>

<script>
// ── CONFIGURACIÓN DE LA HOJA DE SPRITES ──
// Basado en la imagen que pasaste: 4 columnas (frames), 8 filas (poses)
const ANCHO_FRAME = 32;
const ALTO_FRAME = 32;
const TOTAL_FRAMES = 4;

const POSES = [
  { id: 'salta',    fila: 0, nombre: 'salta',     fps: 10, mira: 0 },
  { id: 'corre',    fila: 1, nombre: 'corre',     fps: 12, mira: 1 },
  { id: 'estira',   fila: 2, nombre: 'estira',    fps: 6,  mira: 0 },
  { id: 'camina',   fila: 3, nombre: 'camina',    fps: 8,  mira: 1 },
  { id: 'quieto',   fila: 4, nombre: 'quieto',    fps: 4,  mira: 0 },
  { id: 'lame',     fila: 5, nombre: 'lame',      fps: 6,  mira: 0 },
  { id: 'acuesta',  fila: 6, nombre: 'acuesta',   fps: 5,  mira: 1 },
  { id: 'duerme',   fila: 7, nombre: 'duerme',    fps: 2,  mira: 1 },
];

const hoja = new Image();
hoja.src = 'gato.png';

const stage = document.getElementById('stage');
const lienzo = document.getElementById('lienzo');
const ctx = lienzo.getContext('2d');
const hint = document.getElementById('hint');
const posesBar = document.getElementById('posesBar');
const fpsIn = document.getElementById('fps');
const escIn = document.getElementById('escala');
const vidaIn = document.getElementById('vida');

let ancho = 0, alto = 0, piso = 0;
let escala = 6, fpsGlobal = 8;
const quieta = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Estado del gato
const gato = {
  x: 0, 
  destino: null, 
  mirando: 1, 
  pose: 'quieto',
  cuadro: 0, 
  acum: 0, 
  fijada: null, 
  espera: 2.5,
};

// ── CREAR BOTONES DE POSES ──
POSES.forEach(p => {
  const b = document.createElement('button');
  b.className = 'pose-btn';
  b.setAttribute('aria-pressed', 'false');
  b.dataset.id = p.id;
  
  // Miniatura estática (frame 0)
  const preview = document.createElement('div');
  preview.className = 'sprite-preview';
  preview.style.backgroundPosition = `0px -${p.fila * ALTO_FRAME}px`;
  if (p.mira === -1) preview.style.transform = 'scaleX(-1)';
  
  const txt = document.createElement('span');
  txt.textContent = p.nombre;
  
  b.appendChild(preview);
  b.appendChild(txt);
  
  b.addEventListener('click', () => elegirPose(p.id));
  posesBar.appendChild(b);
});

function elegirPose(id) {
  gato.fijada = gato.fijada === id ? null : id;
  gato.destino = null;
  
  if (gato.fijada) {
    cambiarPose(id);
  } else {
    gato.espera = 0.5;
    cambiarPose('quieto');
  }
  
  [...posesBar.children].forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.id === gato.fijada));
  });
}

// ── LÓGICA DEL CANVAS ──
function medir() {
  const r = stage.getBoundingClientRect();
  ancho = r.width; 
  alto = r.height;
  piso = alto * 0.82; // El gato camina un poco por encima del borde inferior
  
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width = Math.round(ancho * dpr);
  lienzo.height = Math.round(alto * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  
  if (!gato.x) gato.x = ancho / 2;
  gato.x = Math.max(borde(), Math.min(ancho - borde(), gato.x));
}
const borde = () => (ANCHO_FRAME * escala) / 2 + 10;
new ResizeObserver(medir).observe(stage);

// ── INTERACCIÓN ──
stage.addEventListener('pointerdown', e => {
  const r = stage.getBoundingClientRect();
  gato.destino = Math.max(borde(), Math.min(ancho - borde(), e.clientX - r.left));
  gato.fijada = null;
  [...posesBar.children].forEach(b => b.setAttribute('aria-pressed', 'false'));
  hint.classList.add('gone');
});

addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  gato.destino = Math.max(borde(), Math.min(ancho - borde(), gato.x + (e.key === 'ArrowRight' ? 90 : -90)));
  hint.classList.add('gone');
});

fpsIn.addEventListener('input', () => {
  fpsGlobal = +fpsIn.value;
  document.getElementById('fpsOut').textContent = fpsGlobal;
});
escIn.addEventListener('input', () => {
  escala = +escIn.value;
  document.getElementById('escalaOut').textContent = escala + '×';
  medir();
});

// ── INTELIGENCIA ARTIFICIAL (Vida propia) ──
const OCIO = ['quieto', 'quieto', 'lame', 'salta', 'estira', 'camina', 'acuesta'];

function ocurrencia() {
  if (Math.random() < 0.35 && !quieta) {
    gato.destino = borde() + Math.random() * (ancho - 2 * borde());
    gato.espera = 3;
    return;
  }
  const p = OCIO[Math.floor(Math.random() * OCIO.length)];
  if (p === 'acuesta') {
    cambiarPose('acuesta'); 
    gato.espera = 1.2;
    setTimeout(() => {
      if (!gato.fijada && !gato.destino && gato.pose === 'acuesta') cambiarPose('duerme');
    }, 1200);
    gato.espera = 6; 
    return;
  }
  cambiarPose(p);
  gato.espera = 2 + Math.random() * 3;
}

function cambiarPose(pose) {
  if (gato.pose === pose) return;
  gato.pose = pose;
  gato.cuadro = 0;
  gato.acum = 0;
}

// ── BUCLE DE ANIMACIÓN ──
let anterior = performance.now();

function bucle(ahora) {
  const dt = Math.min((ahora - anterior) / 1000, 0.1);
  anterior = ahora;

  // Movimiento
  if (gato.destino !== null) {
    const d = gato.destino - gato.x;
    const dist = Math.abs(d);
    
    if (dist < 4) {
      gato.destino = null;
      cambiarPose(gato.fijada || 'quieto');
      gato.espera = 2;
    } else {
      const corriendo = dist > 150;
      const vel = (corriendo ? 140 : 70) * (escala / 5);
      gato.mirando = d > 0 ? 1 : -1;
      gato.x += Math.sign(d) * Math.min(vel * dt, dist);
      cambiarPose(corriendo ? 'corre' : 'camina');
    }
  } else if (gato.fijada) {
    cambiarPose(gato.fijada);
  } else if (vidaIn.checked && !quieta) {
    gato.espera -= dt;
    if (gato.espera <= 0) ocurrencia();
  } else {
    cambiarPose('quieto');
  }

  // Cambiar frame de animación
  const p = POSES.find(x => x.id === gato.pose) || POSES[4];
  const v = gato.destino !== null ? p.fps : (gato.fijada ? fpsGlobal : p.fps);
  
  gato.acum += dt;
  if (gato.acum >= 1 / v) {
    gato.acum = 0;
    gato.cuadro = (gato.cuadro + 1) % TOTAL_FRAMES;
  }

  dibujar();
  requestAnimationFrame(bucle);
}

function dibujar() {
  ctx.clearRect(0, 0, ancho, alto);
  if (!hoja.complete) return;

  const lado = ANCHO_FRAME * escala;
  const px = Math.round(gato.x - lado / 2);
  const py = Math.round(piso - lado);

  // Sombra
  ctx.save();
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(gato.x, piso + 2, lado * 0.3, lado * 0.08, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Dibujar gato
  const poseActual = POSES.find(x => x.id === gato.pose) || POSES[4];
  const espejar = poseActual.mira !== 0 && gato.mirando !== poseActual.mira;
  
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  
  const sx = gato.cuadro * ANCHO_FRAME;
  const sy = poseActual.fila * ALTO_FRAME;
  
  if (espejar) {
    ctx.translate(px + lado, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(hoja, sx, sy, ANCHO_FRAME, ALTO_FRAME, 0, py, lado, lado);
  } else {
    ctx.drawImage(hoja, sx, sy, ANCHO_FRAME, ALTO_FRAME, px, py, lado, lado);
  }
  
  ctx.restore();
}

// Iniciar
hoja.onload = () => {
  medir();
  requestAnimationFrame(bucle);
};
</script>
</body>
</html>
