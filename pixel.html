<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gato pixel</title>

<style>
:root{
  --night:#17162a;
  --panel:#201e38;
  --floor:#2b2850;
  --line:rgba(252,241,196,.10);
  --text:#efe7d2;
  --muted:#9c96bd;
  --cream:#fcf1c4;
  --orange:#d69260;
  --dark:#684628;
  --teal:#5fb8a8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="dark"]){
  color-scheme:light dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --night:#efe6d2;
    --panel:#f7f0dd;
    --floor:#e4d8bd;
    --line:rgba(104,70,40,.14);
    --text:#3a2d1c;
    --muted:#8a7657;
    --teal:#2f8474;
  }
}
:root[data-theme="dark"]{
  --night:#17162a; --panel:#201e38; --floor:#2b2850;
  --line:rgba(252,241,196,.10); --text:#efe7d2; --muted:#9c96bd; --teal:#5fb8a8;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;
  background:var(--night);color:var(--text);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:min(900px, 100vw);margin:0 auto;padding:clamp(8px,2vh,28px) clamp(8px,2vw,20px) 40px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;margin-bottom:18px}
h1{
  font-family:"Silkscreen",monospace;font-weight:700;
  font-size:clamp(26px,6vw,40px);line-height:1;letter-spacing:.02em;
  margin:0;color:var(--cream);
}
:root:not([data-theme="dark"]) h1{color:var(--dark)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h1{color:var(--cream)}}
header p{margin:0;color:var(--muted);max-width:44ch}

    linear-gradient(180deg,var(--panel) 0%,var(--panel) 72%,var(--floor) 72%,var(--floor) 100%);
  image-rendering:pixelated;
  box-shadow:inset 0 0 0 2px var(--line);
  touch-action:manipulation;
}
.stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),
                   linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;
  mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 78%);
}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{
  position:absolute;left:14px;bottom:12px;z-index:2;
  font-family:"Silkscreen",monospace;font-size:11px;color:var(--muted);
  pointer-events:none;transition:opacity .4s;
}
.hint.gone{opacity:0}

.rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin-top:22px}
.pose{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px 6px 8px;border:2px solid transparent;border-radius:3px;
  background:var(--panel);color:var(--muted);
  font-family:"Silkscreen",monospace;font-size:10px;letter-spacing:.02em;
  cursor:pointer;
}
.pose:hover{color:var(--text)}
.pose:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.pose[aria-pressed="true"]{border-color:var(--teal);color:var(--text)}
.sprite{
  width:64px;height:64px;
  background-image:var(--sheet);
  background-size:256px 512px;
  background-repeat:no-repeat;
  image-rendering:pixelated;
  animation:strip 800ms steps(4) infinite;
}
@keyframes strip{from{background-position-x:0}to{background-position-x:-256px}}

.dials{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:center;margin-top:22px;
  padding-top:18px;border-top:2px solid var(--line)}
.dial{display:flex;align-items:center;gap:10px}
.dial label{font-family:"Silkscreen",monospace;font-size:10px;color:var(--muted)}
input[type=range]{width:130px;accent-color:var(--teal)}
input[type=checkbox]{accent-color:var(--teal);width:16px;height:16px}
.dial output{font-variant-numeric:tabular-nums;color:var(--text);min-width:3ch}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer}

footer{margin-top:28px;color:var(--muted);font-size:13px;max-width:60ch}
kbd{font-family:"Silkscreen",monospace;font-size:10px;border:1px solid var(--line);
  padding:2px 5px;border-radius:2px;color:var(--text)}

@media (prefers-reduced-motion: reduce){
  .sprite{animation-duration:2400ms}
}

@media (max-width: 820px) and (orientation: landscape){
  header p{ display:none; }
  h1{ font-size:clamp(18px, 5vh, 32px); }
  .stage{ aspect-ratio:16/9; min-height:clamp(120px, 60vh, 400px); }
  .rail{ grid-template-columns:repeat(auto-fit, minmax(clamp(56px,12vw,104px),1fr)); gap:6px; margin-top:12px; }
  .sprite{ width:clamp(40px,9vw,64px); height:clamp(40px,9vw,64px); }
  .dials{ gap:10px 16px; margin-top:12px; padding-top:12px; }
  input[type=range]{ width:clamp(80px, 22vw, 130px); }
  footer{ display:none; }
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Gato</h1>
    <p>Toca el escenario y va caminando hasta ahí. Si lo dejás solo, se busca la vida.</p>
  </header>

  <div class="stage" id="stage">
    <canvas id="lienzo"></canvas>
    <span class="hint" id="hint">toca para llamarlo</span>
  </div>

  <div class="rail" id="rail"></div>

  <div class="dials">
    <div class="dial">
      <label for="fps">cuadros/s</label>
      <input type="range" id="fps" min="2" max="16" step="1" value="8">
      <output id="fpsOut">8</output>
    </div>
    <div class="dial">
      <label for="escala">tamaño</label>
      <input type="range" id="escala" min="2" max="10" step="1" value="5">
      <output id="escalaOut">5×</output>
    </div>
    <label class="switch">
      <input type="checkbox" id="vida" checked>
      <span class="dial"><span style="font-family:Silkscreen,monospace;font-size:10px;color:var(--muted)">vida propia</span></span>
    </label>
  </div>

  <footer>
    Flechas <kbd>←</kbd> <kbd>→</kbd> para moverlo a mano. Elegí una pose de la fila de arriba para dejarlo fijo en esa animación.
  </footer>
</div>

/* 8 filas × 4 cuadros, cada cuadro de 32×32 en la hoja de 128×256 */
/* mira: hacia dónde apunta el dibujo original.
   1 = a la derecha, -1 = a la izquierda, 0 = de frente (nunca se espeja) */
const POSES = [
  {id:'salta',    fila:0, nombre:'salta',    fps:10, mira: 0},
  {id:'corre',    fila:1, nombre:'corre',    fps:12, mira: 1},
  {id:'estira',   fila:2, nombre:'se estira',fps:6,  mira: 0},
  {id:'camina',   fila:3, nombre:'camina',   fps:8,  mira:-1},
  {id:'quieto',   fila:4, nombre:'quieto',   fps:4,  mira: 0},
  {id:'lame',     fila:5, nombre:'se lame',  fps:6,  mira: 0},
  {id:'acuesta',  fila:6, nombre:'se acuesta',fps:5, mira: 1},
  {id:'duerme',   fila:7, nombre:'duerme',   fps:2,  mira: 1},
];
const porId = Object.fromEntries(POSES.map(p => [p.id, p]));

const hoja = new Image();
hoja.src = HOJA;

const stage  = document.getElementById('stage');
const lienzo = document.getElementById('lienzo');
const ctx    = lienzo.getContext('2d');
const hint   = document.getElementById('hint');
const rail   = document.getElementById('rail');
const fpsIn  = document.getElementById('fps');
const escIn  = document.getElementById('escala');
const vidaIn = document.getElementById('vida');

const quieta = matchMedia('(prefers-reduced-motion: reduce)').matches;

const gato = {
  x:0, y:0,          // posición en px CSS dentro del escenario (centro de los pies)
  destino:null,
  mirando:1,         // 1 derecha, -1 izquierda
  pose:'quieto',
  cuadro:0,
  acum:0,
  fijada:null,       // pose elegida a mano
  espera:2.5,        // segundos hasta la próxima ocurrencia
};

let escala = 5, fps = 8, ancho = 0, alto = 0, piso = 0;

/* ---------- fila de poses ---------- */
POSES.forEach(p => {
  const b = document.createElement('button');
  b.className = 'pose';
  b.type = 'button';
  b.setAttribute('aria-pressed','false');
  b.dataset.id = p.id;
  b.innerHTML = `<span class="sprite" style="background-position-y:${-p.fila*64}px;
                  animation-duration:${Math.round(4000/p.fps)}ms;
                  transform:scaleX(${p.mira === -1 ? -1 : 1})"></span>${p.nombre}`;
  b.addEventListener('click', () => elegirPose(p.id));
  rail.appendChild(b);
});
document.documentElement.style.setProperty('--sheet', `url("${HOJA}")`);

function elegirPose(id){
  gato.fijada = gato.fijada === id ? null : id;
  gato.destino = null;
  if (gato.fijada) cambiar(id);
  else { gato.espera = 0.4; cambiar('quieto'); }
  [...rail.children].forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.id === gato.fijada)));
}

function cambiar(pose){
  if (gato.pose === pose) return;
  gato.pose = pose; gato.cuadro = 0; gato.acum = 0;
}

/* ---------- escenario ---------- */
function medir(){
  const r = stage.getBoundingClientRect();
  ancho = r.width; alto = r.height;
  piso = alto * 0.80;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  lienzo.width  = Math.round(ancho * dpr);
  lienzo.height = Math.round(alto  * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled = false;
  if (!gato.x) { gato.x = ancho/2; }
  gato.x = Math.max(borde(), Math.min(ancho - borde(), gato.x));
  gato.y = piso;
}
const borde = () => 16*escala/2 + 6;
new ResizeObserver(medir).observe(stage);

stage.addEventListener('pointerdown', e => {
  const r = stage.getBoundingClientRect();
  gato.destino = Math.max(borde(), Math.min(ancho - borde(), e.clientX - r.left));
  hint.classList.add('gone');
});

addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  gato.destino = Math.max(borde(),
    Math.min(ancho - borde(), gato.x + (e.key === 'ArrowRight' ? 90 : -90)));
  hint.classList.add('gone');
});

fpsIn.addEventListener('input', () => {
  fps = +fpsIn.value; document.getElementById('fpsOut').textContent = fps;
});
escIn.addEventListener('input', () => {
  escala = +escIn.value; document.getElementById('escalaOut').textContent = escala + '×';
  medir();
});

/* ---------- vida propia ---------- */
const OCIO = ['quieto','quieto','lame','salta','estira','camina','acuesta'];

function ocurrencia(){
  if (Math.random() < 0.35 && !quieta){                   // sale a dar una vuelta
    gato.destino = borde() + Math.random() * (ancho - 2*borde());
    gato.espera = 3;
    return;
  }
  const p = OCIO[Math.floor(Math.random()*OCIO.length)];
  if (p === 'acuesta'){ cambiar('acuesta'); gato.espera = 1.2; setTimeout(()=>{
      if (!gato.fijada && !gato.destino && gato.pose==='acuesta') cambiar('duerme');
    }, 1200); gato.espera = 6; return; }
  cambiar(p);
  gato.espera = 2 + Math.random()*3;
}

/* ---------- bucle ---------- */
let anterior = performance.now();

function bucle(ahora){
  const dt = Math.min((ahora - anterior)/1000, 0.1);
  anterior = ahora;

  if (gato.destino !== null){
    const d = gato.destino - gato.x;
    const dist = Math.abs(d);
    if (dist < 3){
      gato.destino = null;
      cambiar(gato.fijada || 'quieto');
      gato.espera = 1.5;
    } else {
      const corriendo = dist > 180;
      const vel = (corriendo ? 150 : 80) * (escala/5);
      gato.mirando = d > 0 ? 1 : -1;
      gato.x += Math.sign(d) * Math.min(vel*dt, dist);
      cambiar(corriendo ? 'corre' : 'camina');
    }
  } else if (gato.fijada){
    cambiar(gato.fijada);
  } else if (vidaIn.checked && !quieta){
    gato.espera -= dt;
    if (gato.espera <= 0) ocurrencia();
  } else {
    cambiar('quieto');
  }

  // avance de cuadros
  const p = porId[gato.pose];
  const v = gato.destino !== null ? p.fps : (gato.fijada ? fps : p.fps);
  gato.acum += dt;
  if (gato.acum >= 1/v){ gato.acum = 0; gato.cuadro = (gato.cuadro + 1) % 4; }

  dibujar();
  requestAnimationFrame(bucle);
}

function dibujar(){
  ctx.clearRect(0,0,ancho,alto);
  if (!hoja.complete) return;
  const lado = 32*escala;
  const px = Math.round(gato.x - lado/2);
  const py = Math.round(piso - lado + 4*escala);   // los pies apoyan en el piso

  // sombra
  ctx.save();
  ctx.globalAlpha = .22;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(gato.x, piso + 2, lado*0.26, lado*0.055, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  const pose = porId[gato.pose];
  const fila = pose.fila;
  // solo se espeja si el dibujo apunta al lado contrario al que va el gato
  const espejar = pose.mira !== 0 && gato.mirando !== pose.mira;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (espejar){
    ctx.translate(px + lado, 0);
    ctx.scale(-1,1);
    ctx.drawImage(hoja, gato.cuadro*32, fila*32, 32,32, 0, py, lado, lado);
  } else {
    ctx.drawImage(hoja, gato.cuadro*32, fila*32, 32,32, px, py, lado, lado);
  }
  ctx.restore();
}
// Auto-ajustar escala del gato al ancho del escenario (útil en móvil)
function ajustarEscalaAuto(){
  const r = stage.getBoundingClientRect();
  const escalaAuto = Math.max(2, Math.min(10, Math.round(r.width / 160)));
  if (escala !== escalaAuto){
    escala = escalaAuto;
    escIn.value = escalaAuto;
    document.getElementById('escalaOut').textContent = escalaAuto + '×';
    medir();
  }
}
ajustarEscalaAuto();
addEventListener('resize', ajustarEscalaAuto);

hoja.onload = () => { medir(); requestAnimationFrame(bucle); };
</script>
</body>
